# =============================================================================
# Aurora Responde — orquestração local com Docker Compose (fork leve só-Jurema)
#
#   web          : aplicação Django (webapp + src)
#   ollama       : servidor de LLM local (Jurema-7B — único LLM do projeto)
#   ollama-pull  : baixa o Jurema-7B do Ollama e sai
#   valkey       : cache / contadores de rate limit (guardrails)
#
# O BANCO É EXTERNO — não há serviço de Postgres aqui. O app conecta ao banco
# definido no seu .env (variáveis PG*). Se o Postgres roda na própria máquina
# (host), use PGHOST=host.docker.internal no .env.
# =============================================================================

services:
  web:
    build: .
    image: aurora-web
    env_file:
      - .env
    environment:
      # Dentro da rede do compose, o Ollama é o serviço 'ollama' (sobrepõe o .env)
      OLLAMA_HOST: http://ollama:11434
      # Único LLM: o Jurema redige todas as respostas (não há mais Qwen3).
      OLLAMA_MODEL: jurema-7b
      JUREMA_MODEL: jurema-7b
      # Fonte SIPIA-CT (Conselho Tutelar): view UF-level pré-agregada no banco.
      SIPIA_CT_TABLE: sipiact.vw_sipiact_long
      SIPIA_CT_VALUE_COL: quantidade
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
      # Contadores de limite / cache Django (cliente Redis é compatível com Valkey)
      VALKEY_URL: redis://valkey:6379/0
    ports:
      - "8000:8000"
    extra_hosts:
      # Permite alcançar um Postgres EXTERNO rodando no host (Docker Desktop)
      - "host.docker.internal:host-gateway"
    depends_on:
      ollama:
        condition: service_started
      valkey:
        condition: service_healthy
    restart: unless-stopped

  # Cache e contadores de rate limit para o app guardrails (limites.py).
  # Dev no host (fora do compose): docker compose up -d valkey e
  # VALKEY_URL=redis://127.0.0.1:6379/0 no .env.
  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    # --- GPU (opcional) ---------------------------------------------------
    # Requer NVIDIA + nvidia-container-toolkit (no Windows: WSL2 + driver).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Provisiona o ÚNICO modelo do Ollama: Jurema-7B (redige todas as respostas).
  # Roda uma vez e sai. O Jurema é importado do GGUF publicado no HuggingFace
  # (fine-tune do Qwen2.5-7B) e apelidado como 'jurema-7b' para bater com
  # JUREMA_MODEL/OLLAMA_MODEL do app.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - >
        until ollama list >/dev/null 2>&1; do
          echo '[ollama-pull] aguardando o servidor ollama...'; sleep 2;
        done;
        echo '[ollama-pull] baixando Jurema-7B (~4,7 GB) do HuggingFace...';
        if ollama pull hf.co/rlmoura/Jurema-7B-Q4_K_M-GGUF; then
          ollama cp hf.co/rlmoura/Jurema-7B-Q4_K_M-GGUF jurema-7b;
          echo '[ollama-pull] Jurema instalado como jurema-7b.';
        else
          echo '[ollama-pull] ERRO: falha ao baixar o Jurema — o chat NAO responde sem ele.';
        fi;
        echo '[ollama-pull] provisionamento do Ollama concluido.'
    restart: "no"

volumes:
  ollama-models:
  valkey-data:
