<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" font-family="Raleway, Inter, 'Segoe UI', sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8a97a8"/>
    </marker>
    <style>
      .title{font-size:25px;font-weight:800;fill:#071D41}
      .sub{font-size:13px;fill:#5b6b7b}
      .boxt{font-size:17px;font-weight:700}
      .boxs{font-size:12.5px}
      .name{font-size:15px;font-weight:800;fill:#ffffff}
      .chat{font-size:14.5px;font-weight:700;fill:#0f5c1a}
      .flow{stroke:#8a97a8;stroke-width:2;fill:none}
      .join{stroke:#8a97a8;stroke-width:1.6;fill:none;stroke-dasharray:5 4}
      .loop{font-size:14px;font-weight:600;fill:#0c326f}
    </style>
  </defs>
  <rect width="1100" height="620" fill="#f4f6fb"/>

  <text x="550" y="40" text-anchor="middle" class="title">Aurora responde — um chat, os quatro pesquisadores</text>
  <text x="550" y="62" text-anchor="middle" class="sub">Cada chat vira uma fonte do orquestrador; por baixo, o Qwen3 roteia e cita a origem</text>

  <!-- Chat único -->
  <rect x="450" y="80" width="200" height="52" rx="12" fill="#ffffff" stroke="#dce3ec" stroke-width="1.5"/>
  <text x="550" y="105" text-anchor="middle" class="boxt" fill="#1b2a3a">Chat único</text>
  <text x="550" y="123" text-anchor="middle" class="boxs" fill="#5b6b7b">Aurora responde · gov.br</text>
  <path class="flow" d="M550,132 L550,164" marker-end="url(#a)"/>

  <!-- Qwen3 -->
  <rect x="380" y="164" width="340" height="66" rx="12" fill="#eef0ff" stroke="#6b5cff" stroke-width="1.8"/>
  <text x="550" y="192" text-anchor="middle" class="boxt" fill="#3b2fb0">Qwen3-8B · Orquestrador</text>
  <text x="550" y="212" text-anchor="middle" class="boxs" fill="#4a3fb0">roteia · monta · interpreta · cita a fonte</text>

  <!-- setas Qwen3 -> 4 chats -->
  <path class="flow" d="M550,230 C360,275 200,290 150,336" marker-end="url(#a)"/>
  <path class="flow" d="M550,230 C500,278 430,300 418,336" marker-end="url(#a)"/>
  <path class="flow" d="M550,230 C600,278 670,300 682,336" marker-end="url(#a)"/>
  <path class="flow" d="M550,230 C740,275 900,290 950,336" marker-end="url(#a)"/>

  <!-- ===== 4 chats dos pesquisadores (aba azul com o nome) ===== -->
  <!-- Hernandison -->
  <rect x="20" y="356" width="250" height="118" rx="12" fill="#e8f5ee" stroke="#168821" stroke-width="1.6"/>
  <rect x="55" y="340" width="180" height="30" rx="15" fill="#1351B4"/>
  <text x="145" y="360" text-anchor="middle" class="name">Hernandison</text>
  <text x="145" y="398" text-anchor="middle" class="chat">Séries temporais</text>
  <text x="145" y="420" text-anchor="middle" class="boxs" fill="#2f6b3a">Chronos-2 · análise</text>
  <text x="145" y="438" text-anchor="middle" class="boxs" fill="#2f6b3a">retrospectiva</text>

  <!-- Marcelo -->
  <rect x="290" y="356" width="250" height="118" rx="12" fill="#e8f5ee" stroke="#168821" stroke-width="1.6"/>
  <rect x="325" y="340" width="180" height="30" rx="15" fill="#1351B4"/>
  <text x="415" y="360" text-anchor="middle" class="name">Marcelo</text>
  <text x="415" y="398" text-anchor="middle" class="chat">Dados SINAN</text>
  <text x="415" y="420" text-anchor="middle" class="boxs" fill="#2f6b3a">Consulta SQL (ORM)</text>
  <text x="415" y="438" text-anchor="middle" class="boxs" fill="#2f6b3a">contar · ranking · relatório</text>

  <!-- Rafael -->
  <rect x="560" y="356" width="250" height="118" rx="12" fill="#e8f5ee" stroke="#168821" stroke-width="1.6"/>
  <rect x="595" y="340" width="180" height="30" rx="15" fill="#1351B4"/>
  <text x="685" y="360" text-anchor="middle" class="name">Rafael</text>
  <text x="685" y="398" text-anchor="middle" class="chat">Chatbot geral</text>
  <text x="685" y="420" text-anchor="middle" class="boxs" fill="#2f6b3a">VIOLBR / SINAM</text>
  <text x="685" y="438" text-anchor="middle" class="boxs" fill="#2f6b3a">perfil e recortes</text>

  <!-- Eduardo -->
  <rect x="830" y="356" width="250" height="118" rx="12" fill="#e8f5ee" stroke="#168821" stroke-width="1.6"/>
  <rect x="865" y="340" width="180" height="30" rx="15" fill="#1351B4"/>
  <text x="955" y="360" text-anchor="middle" class="name">Eduardo</text>
  <text x="955" y="398" text-anchor="middle" class="chat">Dados Jurídicos</text>
  <text x="955" y="420" text-anchor="middle" class="boxs" fill="#2f6b3a">Jurema · leis/ECA/normas</text>
  <text x="955" y="438" text-anchor="middle" class="boxs" fill="#2f6b3a">parecer citado</text>

  <!-- retorno ao Qwen3 -->
  <path class="join" d="M145,474 C145,505 470,512 545,500" marker-end="url(#a)"/>
  <path class="join" d="M955,474 C955,505 630,512 555,500" marker-end="url(#a)"/>
  <text x="550" y="505" text-anchor="middle" class="loop">&#8635; todo retorno volta ao Qwen3 para síntese e citação da fonte</text>

  <!-- fontes novas da equipe -->
  <rect x="150" y="528" width="800" height="66" rx="10" fill="#eef3fb" stroke="#1351B4" stroke-width="1.4"/>
  <text x="550" y="552" text-anchor="middle" class="boxt" fill="#0c326f" font-size="14.5">Fontes novas da equipe (compartilhadas)</text>
  <text x="550" y="575" text-anchor="middle" class="boxs" fill="#33475e">SIPIA-CT — Conselho Tutelar (SQL por UF/ano)  ·  RAG interno — documentação do produto</text>
</svg>
