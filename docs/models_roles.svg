<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" font-family="Inter, system-ui, sans-serif">

  <defs>
    <linearGradient id="qwenG" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="c2G" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="bgG" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f1115"/>
      <stop offset="100%" stop-color="#13161c"/>
    </linearGradient>

    <marker id="arrGray" markerWidth="12" markerHeight="12" refX="11" refY="4" orient="auto">
      <path d="M0,0 L0,8 L11,4 z" fill="#94a3b8"/></marker>
    <marker id="arrIndigo" markerWidth="12" markerHeight="12" refX="11" refY="4" orient="auto">
      <path d="M0,0 L0,8 L11,4 z" fill="#818cf8"/></marker>
    <marker id="arrPink" markerWidth="12" markerHeight="12" refX="11" refY="4" orient="auto">
      <path d="M0,0 L0,8 L11,4 z" fill="#ec4899"/></marker>
    <marker id="arrAmber" markerWidth="12" markerHeight="12" refX="11" refY="4" orient="auto">
      <path d="M0,0 L0,8 L11,4 z" fill="#fbbf24"/></marker>
    <marker id="arrCyan" markerWidth="12" markerHeight="12" refX="11" refY="4" orient="auto">
      <path d="M0,0 L0,8 L11,4 z" fill="#06b6d4"/></marker>
    <marker id="arrEmer" markerWidth="12" markerHeight="12" refX="11" refY="4" orient="auto">
      <path d="M0,0 L0,8 L11,4 z" fill="#10b981"/></marker>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1400" height="1000" fill="url(#bgG)"/>
  <circle cx="200" cy="100" r="280" fill="#6366f1" opacity="0.05"/>
  <circle cx="1200" cy="900" r="280" fill="#ec4899" opacity="0.05"/>


  <!-- TITLE -->
  <g transform="translate(40, 40)">
    <text x="0" y="22" font-size="24" font-weight="700" fill="#e6e8eb">Papéis dos modelos</text>
    <text x="0" y="44" font-size="13" fill="#94a3b8">1 orquestrador · 2 modelos foundation · 3 baselines · 1 QA — 6 modelos coordenados</text>
  </g>
  <text x="1360" y="42" font-size="11" fill="#94a3b8" text-anchor="end" font-weight="500">Aurora · papéis dos modelos</text>


  <!-- ====================== STEP 1: User ====================== -->
  <g transform="translate(540, 100)">
    <rect width="320" height="68" rx="12" fill="#1c2030" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="30" cy="34" r="10" fill="#22c55e"/>
    <circle cx="30" cy="34" r="4" fill="#0f1115"/>
    <text x="56" y="32" font-size="14" font-weight="600" fill="#e6e8eb">Você (pergunta em PT-BR)</text>
    <text x="56" y="50" font-size="10.5" fill="#94a3b8">"quais casos em Malhador-SE?"</text>
  </g>

  <line x1="700" y1="168" x2="700" y2="200" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrGray)"/>


  <!-- ====================== STEP 2: Qwen3 (orchestrator) ====================== -->
  <g transform="translate(440, 210)">
    <rect width="520" height="140" rx="14" fill="#161922" stroke="#818cf8" stroke-width="2.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="520" height="34" rx="14" fill="rgba(129,140,248,.18)"/>
    <rect x="0" y="20" width="520" height="14" fill="rgba(129,140,248,.18)"/>
    <text x="20" y="22" font-size="13" font-weight="700" fill="#a5b4fc">PAPEL · ORQUESTRADOR</text>
    <text x="500" y="22" font-size="11" fill="#94a3b8" text-anchor="end">via Ollama · CPU+GPU</text>

    <g transform="translate(24, 50)">
      <rect width="80" height="80" rx="16" fill="url(#qwenG)" filter="url(#glow)"/>
      <text x="40" y="46" font-size="26" font-weight="800" fill="white" text-anchor="middle">Q</text>
      <text x="40" y="64" font-size="9" font-weight="700" fill="white" text-anchor="middle">Qwen3</text>
    </g>

    <text x="120" y="68" font-size="18" font-weight="700" fill="#e6e8eb">Qwen3-8B-Instruct</text>
    <text x="120" y="88" font-size="12" fill="#cbd5e1">Lê sua pergunta · decide quais tools chamar</text>
    <text x="120" y="104" font-size="12" fill="#cbd5e1">Lê o JSON do resultado · escreve resposta em prosa</text>
    <text x="120" y="124" font-size="11" font-style="italic" fill="#a5b4fc">Não toca em dado nem prevê. Só decide e narra.</text>
  </g>

  <!-- Two branches: factual / forecast -->
  <text x="700" y="378" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">↓ chama tools (decisão do Qwen3) ↓</text>

  <!-- left branch: factual (no AI) -->
  <line x1="560" y1="350" x2="280" y2="410" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrEmer)"/>
  <!-- right branch: forecast pipeline -->
  <line x1="840" y1="350" x2="1140" y2="410" stroke="#ec4899" stroke-width="2.5" marker-end="url(#arrPink)"/>


  <!-- ====================== LEFT: Factual ====================== -->
  <g transform="translate(60, 420)">
    <rect width="440" height="110" rx="14" fill="#161922" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="440" height="34" rx="14" fill="rgba(16,185,129,.15)"/>
    <rect x="0" y="20" width="440" height="14" fill="rgba(16,185,129,.15)"/>
    <text x="20" y="22" font-size="13" font-weight="700" fill="#6ee7b7">PAPEL · CONSULTA FACTUAL (sem IA)</text>

    <text x="20" y="58" font-size="13" font-weight="600" fill="#e6e8eb">consultar · contar · serie_temporal</text>
    <text x="20" y="78" font-size="11" fill="#94a3b8">Django ORM puro no PostgreSQL (~3.1M notificações).</text>
    <text x="20" y="94" font-size="10.5" fill="#5e6472">Resultado vem 100% do banco. Zero alucinação possível.</text>
  </g>

  <text x="280" y="555" font-size="11" fill="#94a3b8" text-anchor="middle">resultado factual</text>


  <!-- ====================== RIGHT: previsao_automatica pipeline ====================== -->
  <g transform="translate(900, 420)">
    <rect width="460" height="110" rx="14" fill="#161922" stroke="#ec4899" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="460" height="34" rx="14" fill="rgba(236,72,153,.18)"/>
    <rect x="0" y="20" width="460" height="14" fill="rgba(236,72,153,.18)"/>
    <text x="20" y="22" font-size="13" font-weight="700" fill="#f9a8d4">PAPEL · PIPELINE DE PREVISÃO</text>

    <text x="20" y="58" font-size="13" font-weight="600" fill="#e6e8eb">previsao_automatica · relatorio_municipio</text>
    <text x="20" y="78" font-size="11" fill="#94a3b8">Roda comitê de 3 modelos em backtest walk-forward,</text>
    <text x="20" y="94" font-size="11" fill="#94a3b8">escolhe o vencedor por menor WAPE, prevê com p10/p50/p90.</text>
  </g>

  <line x1="1130" y1="530" x2="1130" y2="570" stroke="#ec4899" stroke-width="2.5" marker-end="url(#arrPink)"/>
  <text x="1145" y="555" font-size="11" font-weight="600" fill="#f9a8d4">comitê paralelo</text>


  <!-- ====================== COMMITTEE: 3 forecasters ====================== -->
  <g transform="translate(640, 580)">
    <rect width="720" height="240" rx="14" fill="rgba(236,72,153,.05)" stroke="rgba(236,72,153,.4)" stroke-dasharray="6,4"/>
    <text x="20" y="22" font-size="12" font-weight="700" fill="#f9a8d4">COMITÊ · cada modelo é testado em backtest e o melhor por WAPE prevê</text>

    <!-- Chronos-2: default winner -->
    <g transform="translate(20, 50)">
      <rect width="220" height="170" rx="12" fill="rgba(236,72,153,.10)" stroke="#ec4899" stroke-width="2" filter="url(#shadow)"/>
      <g transform="translate(76, 18)">
        <rect width="68" height="68" rx="16" fill="url(#c2G)" filter="url(#glow)"/>
        <text x="34" y="40" font-size="22" font-weight="800" fill="white" text-anchor="middle">C2</text>
        <text x="34" y="58" font-size="9" font-weight="700" fill="white" text-anchor="middle">120M</text>
      </g>
      <text x="110" y="108" font-size="14" font-weight="700" fill="#e6e8eb" text-anchor="middle">Chronos-2</text>
      <text x="110" y="124" font-size="10" fill="#fbcfe8" text-anchor="middle">Amazon · GPU · SOTA</text>
      <text x="110" y="142" font-size="9" font-weight="600" fill="#f9a8d4" text-anchor="middle">PAPEL · ESPECIALISTA</text>
      <text x="110" y="156" font-size="9" fill="#94a3b8" text-anchor="middle">vence em ~60% dos casos</text>
      <text x="110" y="166" font-size="9" fill="#94a3b8" text-anchor="middle">retorna mediana + p10/p90</text>
    </g>

    <!-- ETS -->
    <g transform="translate(250, 50)">
      <rect width="220" height="170" rx="12" fill="#1c2030" stroke="#06b6d4" stroke-width="1.5" filter="url(#shadow)"/>
      <g transform="translate(76, 18)">
        <rect width="68" height="68" rx="16" fill="#0891b2" filter="url(#glow)"/>
        <text x="34" y="44" font-size="20" font-weight="800" fill="white" text-anchor="middle">ETS</text>
        <text x="34" y="58" font-size="9" font-weight="700" fill="white" text-anchor="middle">CPU</text>
      </g>
      <text x="110" y="108" font-size="14" font-weight="700" fill="#e6e8eb" text-anchor="middle">ETS (Holt-Winters)</text>
      <text x="110" y="124" font-size="10" fill="#a5f3fc" text-anchor="middle">statsmodels · &lt; 1s</text>
      <text x="110" y="142" font-size="9" font-weight="600" fill="#67e8f9" text-anchor="middle">PAPEL · BASELINE FORTE</text>
      <text x="110" y="156" font-size="9" fill="#94a3b8" text-anchor="middle">vence em séries curtas com</text>
      <text x="110" y="166" font-size="9" fill="#94a3b8" text-anchor="middle">sazonalidade clara (~30%)</text>
    </g>

    <!-- Seasonal Naive -->
    <g transform="translate(480, 50)">
      <rect width="220" height="170" rx="12" fill="#1c2030" stroke="#06b6d4" stroke-width="1.5" filter="url(#shadow)"/>
      <g transform="translate(76, 18)">
        <rect width="68" height="68" rx="16" fill="#0891b2" filter="url(#glow)"/>
        <text x="34" y="44" font-size="20" font-weight="800" fill="white" text-anchor="middle">SN</text>
        <text x="34" y="58" font-size="9" font-weight="700" fill="white" text-anchor="middle">ms</text>
      </g>
      <text x="110" y="108" font-size="14" font-weight="700" fill="#e6e8eb" text-anchor="middle">Seasonal Naive</text>
      <text x="110" y="124" font-size="10" fill="#a5f3fc" text-anchor="middle">repete último ciclo</text>
      <text x="110" y="142" font-size="9" font-weight="600" fill="#67e8f9" text-anchor="middle">PAPEL · SANITY CHECK</text>
      <text x="110" y="156" font-size="9" fill="#94a3b8" text-anchor="middle">se nenhum modelo bater</text>
      <text x="110" y="166" font-size="9" fill="#94a3b8" text-anchor="middle">"repetir 2024", é fé</text>
    </g>
  </g>

  <!-- Backtest arrow showing committee → winner -->
  <line x1="1000" y1="820" x2="1000" y2="850" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arrAmber)"/>


  <!-- ====================== WINNER ====================== -->
  <g transform="translate(720, 855)">
    <rect width="560" height="68" rx="14" fill="rgba(251,191,36,.10)" stroke="#fbbf24" stroke-width="2" filter="url(#shadow)"/>
    <text x="20" y="22" font-size="11" font-weight="700" fill="#fbbf24" letter-spacing="0.04em">VENCEDOR (argmin WAPE)</text>
    <text x="20" y="44" font-size="14" font-weight="600" fill="#e6e8eb">Modelo escolhido prevê com p10 · p50 · p90 sobre todo o histórico</text>
    <text x="20" y="60" font-size="10" fill="#94a3b8">+ badge de acurácia: alta &lt; 10% · boa &lt; 25% · média &lt; 50% · baixa &gt; 50%</text>
  </g>

  <line x1="1000" y1="923" x2="1000" y2="943" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arrAmber)"/>


  <!-- ====================== APART: ChatTime (QA) ====================== -->
  <g transform="translate(60, 580)">
    <rect width="540" height="240" rx="14" fill="rgba(71,85,105,0.05)" stroke="rgba(71,85,105,0.5)" stroke-dasharray="6,4"/>
    <text x="20" y="22" font-size="12" font-weight="700" fill="#cbd5e1">OPERADOR SEPARADO · QA múltipla escolha</text>

    <g transform="translate(40, 50)">
      <rect width="220" height="170" rx="12" fill="#1c2030" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
      <g transform="translate(76, 18)">
        <rect width="68" height="68" rx="16" fill="#475569"/>
        <text x="34" y="44" font-size="18" font-weight="800" fill="white" text-anchor="middle">CT</text>
        <text x="34" y="58" font-size="9" font-weight="700" fill="white" text-anchor="middle">7B</text>
      </g>
      <text x="110" y="108" font-size="14" font-weight="700" fill="#e6e8eb" text-anchor="middle">ChatTime-1-7B</text>
      <text x="110" y="124" font-size="10" fill="#cbd5e1" text-anchor="middle">LLM especializado · GPU</text>
      <text x="110" y="142" font-size="9" font-weight="600" fill="#cbd5e1" text-anchor="middle">PAPEL · QA "(a) (b) (c)"</text>
      <text x="110" y="156" font-size="9" fill="#94a3b8" text-anchor="middle">único que faz pergunta</text>
      <text x="110" y="166" font-size="9" fill="#94a3b8" text-anchor="middle">múltipla escolha</text>
    </g>

    <g transform="translate(290, 60)">
      <text x="0" y="14" font-size="11" font-weight="600" fill="#cbd5e1">Quando é usado:</text>
      <text x="0" y="34" font-size="11" fill="#94a3b8">qa_multiple_choice(query_id, pergunta)</text>
      <text x="0" y="48" font-size="11" fill="#94a3b8">qa_from_sql(sql, pergunta)</text>

      <text x="0" y="76" font-size="11" font-weight="600" fill="#cbd5e1">Exemplo:</text>
      <text x="0" y="94" font-size="10" fill="#94a3b8">"A tendência é (a) crescente</text>
      <text x="0" y="108" font-size="10" fill="#94a3b8">(b) estável (c) decrescente?"</text>

      <text x="0" y="138" font-size="11" font-weight="600" fill="#94a3b8">Drift:</text>
      <text x="0" y="156" font-size="10" fill="#5e6472">5o modelo, baseline linear,</text>
      <text x="0" y="170" font-size="10" fill="#5e6472">disponível mas raramente usado</text>
    </g>
  </g>


  <!-- Return arrow: result → Qwen3 (which then narrates) -->
  <path d="M 280 530 Q 280 940 700 940" stroke="#10b981" stroke-width="2" fill="none" stroke-dasharray="6,4" opacity="0.6"/>
  <path d="M 1000 943 L 1000 945" stroke="#fbbf24" stroke-width="2" fill="none"/>
  <text x="540" y="934" font-size="10" fill="#94a3b8" font-style="italic">resultado factual ou previsão volta como JSON ao Qwen3 → narração em prosa</text>


  <!-- Legend caption at bottom -->
  <g transform="translate(60, 970)">
    <text x="0" y="0" font-size="10" font-weight="700" fill="#cbd5e1">REGRA DE OURO:</text>
    <text x="100" y="0" font-size="10" fill="#94a3b8">se o WAPE do vencedor &gt; 25%, desconfie da previsão — mesmo o melhor modelo errou &gt;1/4 do volume no backtest.</text>
  </g>

</svg>
